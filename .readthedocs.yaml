version: 2

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - doc

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      - hg clone https://heptapod.host/pythonian/timeseries-refinery/tshistory_refinery .

sphinx:
  configuration: docs/conf.py
